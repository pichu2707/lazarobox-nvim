name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lua specs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      # -u NONE: los specs no deben depender de plugins ni de lazy.nvim
      - name: Run specs
        run: nvim --headless -u NONE -l tests/run.lua
