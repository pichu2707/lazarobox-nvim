name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Required: git describe needs the full tag history to find the
          # previous tag. A shallow clone would drop every changelog link.
          fetch-depth: 0

      - name: Verify VERSION matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(tr -d '[:space:]' < VERSION)"
          if [ "$tag" != "$file" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the VERSION file (${file}). Bump VERSION before tagging."
            exit 1
          fi
          echo "VERSION file and tag agree on ${file}."

      - name: Build the release notes from the commit log
        run: |
          previous="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          range="${previous:+${previous}..}${GITHUB_REF_NAME}"

          # Types deliberately kept out of the notes. emit() appends to this as
          # it goes, so emit_other() below can never drift out of sync with the
          # groups actually declared.
          covered='bump'

          # Renders one "## Heading" section per conventional-commit type.
          # $1 is an alternation of types, $2 the heading.
          emit() {
            local body
            covered="${covered}|$1"
            body="$(git log --no-merges --pretty=format:'%s|%h' "$range" \
              | { grep -E "^($1)(\([^)]*\))?!?: " || true; } \
              | sed -E 's#^[a-z]+\(([^)]*)\)!?: *(.*)\|(.*)$#- **\1**: \2 (\3)#; s#^[a-z]+!?: *(.*)\|(.*)$#- \1 (\2)#')"
            if [ -n "$body" ]; then
              printf '## %s\n\n%s\n\n' "$2" "$body"
            fi
            # Never let an empty section abort the step under `set -e`.
            return 0
          }

          # Safety net: any conventional commit whose type has no group above
          # still shows up, instead of vanishing from the notes in silence.
          emit_other() {
            local body
            body="$(git log --no-merges --pretty=format:'%s|%h' "$range" \
              | { grep -E "^[a-z]+(\([^)]*\))?!?: " || true; } \
              | { grep -vE "^(${covered})(\([^)]*\))?!?: " || true; } \
              | sed -E 's#^[a-z]+\(([^)]*)\)!?: *(.*)\|(.*)$#- **\1**: \2 (\3)#; s#^[a-z]+!?: *(.*)\|(.*)$#- \1 (\2)#')"
            if [ -n "$body" ]; then
              printf '## %s\n\n%s\n\n' "$1" "$body"
            fi
            return 0
          }

          {
            emit 'feat'           'Features'
            emit 'fix'            'Fixes'
            emit 'perf'           'Performance'
            emit 'refactor'       'Refactoring'
            emit 'ci|build|chore' 'Tooling'
            emit 'docs'           'Documentation'
            emit_other            'Other'
            if [ -n "$previous" ]; then
              printf '**Full changelog**: https://github.com/%s/compare/%s...%s\n' \
                "${GITHUB_REPOSITORY}" "$previous" "${GITHUB_REF_NAME}"
            fi
          } > "${RUNNER_TEMP}/notes.md"

          cat "${RUNNER_TEMP}/notes.md"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "${RUNNER_TEMP}/notes.md" \
            --verify-tag
