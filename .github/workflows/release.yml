name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to preview notes for. Defaults to the most recent tag. Nothing is published."
        required: false
        type: string
  # Called by version.yml right after it tags a release. Tags pushed with
  # GITHUB_TOKEN never trigger the `push: tags` event above, so the version
  # workflow has to invoke this one explicitly.
  workflow_call:
    inputs:
      tag:
        description: "Tag to publish a release for."
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Required: git describe needs the full tag history to find the
          # previous tag. A shallow clone would drop every changelog link.
          fetch-depth: 0

      - name: Resolve the tag
        id: resolve
        env:
          # Via env, never interpolated into the script: a ${{ }} expansion
          # inside run: would let the input inject shell.
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          # Under workflow_call, GITHUB_EVENT_NAME is the CALLER's event (a
          # push to main), so it cannot tell a call from a tag push. The tag
          # input can: it is required on workflow_call and absent on push.
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            publish=false
            if [ -n "${INPUT_TAG}" ]; then
              tag="${INPUT_TAG}"
            else
              tag="$(git describe --tags --abbrev=0)"
            fi
          elif [ -n "${INPUT_TAG}" ]; then
            publish=true
            tag="${INPUT_TAG}"
          elif [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            publish=true
            tag="${GITHUB_REF_NAME}"
          else
            echo "::error::Cannot resolve a tag for event ${GITHUB_EVENT_NAME} on ${GITHUB_REF}."
            exit 1
          fi

          if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error::Tag ${tag} does not exist in this repository."
            exit 1
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: ${tag} (publish: ${publish})"

      - name: Verify VERSION matches the tag
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          PUBLISH: ${{ steps.resolve.outputs.publish }}
        run: |
          want="${TAG#v}"
          # Read VERSION out of the tag's own tree. On workflow_dispatch the
          # checkout is the default branch, whose VERSION has usually moved on.
          got="$(git show "${TAG}:VERSION" | tr -d '[:space:]')"

          if [ "$want" = "$got" ]; then
            echo "VERSION file and tag agree on ${got}."
          elif [ "${PUBLISH}" = "true" ]; then
            echo "::error::Tag ${TAG} does not match its VERSION file (${got}). Bump VERSION before tagging."
            exit 1
          else
            echo "::warning::Tag ${TAG} does not match its VERSION file (${got}). Previewing anyway."
          fi

      - name: Build the release notes from the commit log
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          previous="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          range="${previous:+${previous}..}${TAG}"

          # Types deliberately kept out of the notes. emit() appends to this as
          # it goes, so emit_other() below can never drift out of sync with the
          # groups actually declared.
          covered='bump'

          # Renders one "## Heading" section per conventional-commit type.
          # $1 is an alternation of types, $2 the heading.
          emit() {
            local body
            covered="${covered}|$1"
            body="$(git log --no-merges --pretty=format:'%s|%h' "$range" \
              | { grep -E "^($1)(\([^)]*\))?!?: " || true; } \
              | sed -E 's#^[a-z]+\(([^)]*)\)!?: *(.*)\|(.*)$#- **\1**: \2 (\3)#; s#^[a-z]+!?: *(.*)\|(.*)$#- \1 (\2)#')"
            if [ -n "$body" ]; then
              printf '## %s\n\n%s\n\n' "$2" "$body"
            fi
            # Never let an empty section abort the step under `set -e`.
            return 0
          }

          # Safety net: any conventional commit whose type has no group above
          # still shows up, instead of vanishing from the notes in silence.
          emit_other() {
            local body
            body="$(git log --no-merges --pretty=format:'%s|%h' "$range" \
              | { grep -E "^[a-z]+(\([^)]*\))?!?: " || true; } \
              | { grep -vE "^(${covered})(\([^)]*\))?!?: " || true; } \
              | sed -E 's#^[a-z]+\(([^)]*)\)!?: *(.*)\|(.*)$#- **\1**: \2 (\3)#; s#^[a-z]+!?: *(.*)\|(.*)$#- \1 (\2)#')"
            if [ -n "$body" ]; then
              printf '## %s\n\n%s\n\n' "$1" "$body"
            fi
            return 0
          }

          {
            emit 'feat'           'Features'
            emit 'fix'            'Fixes'
            emit 'perf'           'Performance'
            emit 'refactor'       'Refactoring'
            emit 'ci|build|chore' 'Tooling'
            emit 'docs'           'Documentation'
            emit_other            'Other'
            if [ -n "$previous" ]; then
              printf '**Full changelog**: https://github.com/%s/compare/%s...%s\n' \
                "${GITHUB_REPOSITORY}" "$previous" "${TAG}"
            fi
          } > "${RUNNER_TEMP}/notes.md"

          cat "${RUNNER_TEMP}/notes.md"

      - name: Show the notes in the run summary
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          PUBLISH: ${{ steps.resolve.outputs.publish }}
        run: |
          if [ "${PUBLISH}" = "true" ]; then
            printf '# Release %s\n\n' "${TAG}" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '# Preview of %s\n\n_Dry run: nothing was published._\n\n' "${TAG}" >> "$GITHUB_STEP_SUMMARY"
          fi
          cat "${RUNNER_TEMP}/notes.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Create the release
        if: steps.resolve.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes-file "${RUNNER_TEMP}/notes.md" \
            --verify-tag

      - name: Dry run notice
        if: steps.resolve.outputs.publish != 'true'
        run: echo "::notice::Preview only — no release was created. Push the tag to publish."
